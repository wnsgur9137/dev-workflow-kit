# rules.lock — 외부 규칙·템플릿 저장소의 커밋 고정 목록
#
# 형식: 공백으로 구분한 4열, '#' 으로 시작하는 줄은 주석
#   <name>  <git-url>  <commit>  <paths>
#
#   name     저장 폴더 이름 ($DATA/data/<name>/)
#   git-url  https 저장소 주소
#   commit   40자 커밋 해시 (브랜치·태그 금지)
#   paths    받을 하위 폴더 (쉼표 구분, 전체면 '.')
#
# 갱신은 레포 관리자만 PR 로 한다. docs/security/03 워크플로/업데이트 절차.md
#
# 항목은 P1(semgrep-rules)·P4(nuclei-templates, 선택)에서 추가한다.
