# images.lock — 스캔에 쓰는 컨테이너 이미지의 digest 고정 목록
#
# 형식: 공백으로 구분한 5열, '#' 으로 시작하는 줄은 주석
#   <name>  <image>  <tag>  <digest>  <platforms>
#
#   name       스크립트가 참조하는 이름 (semgrep, gitleaks, osv-scanner, mobsf, zap, egress-proxy ...)
#   image      레지스트리 경로 (태그 없이)
#   tag        사람이 읽는 버전 표기 — 실행에는 쓰지 않는다
#   digest     sha256:<64 hex> — docker pull/run 은 항상 <image>@<digest> 로 한다
#   platforms  지원 플랫폼 (쉼표 구분). linux/arm64 가 없으면 Apple Silicon 에서 에뮬레이션 경고
#
# 갱신은 레포 관리자만 PR 로 한다 (공개 후 7일 이상 지난 릴리스).
#   docs/security/03 워크플로/업데이트 절차.md
#
# 항목은 각 도구를 도입하는 단계에서 추가한다 (P1: semgrep·gitleaks·osv-scanner, P2: mobsf, P3: zap·egress-proxy).
