# R3 — 평문 HTTP 요청 (docs/security/07 스택별 설계/Flutter·React Native.md)
rules:
  - id: insecure-http-url
    message: >-
      평문 http:// 주소로 요청합니다. Android 9+·iOS ATS 기본 설정에서 막히거나, 허용돼 있다면 통신이 노출됩니다. https 를 쓰세요.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      owasp: ["M3: Insecure Communication"]
      stack: react-native
    # 로컬 개발 주소(localhost·127.0.0.1·에뮬레이터 10.0.2.2)는 제외 — 호스트가 그 이름으로 끝나야 한다 (Flutter F4 와 같은 정규식).
    # URL 인자는 메타변수 + metavariable-regex 로 소스 텍스트(따옴표 포함)를 보므로 보간 템플릿(`http://host/${id}`)도 잡는다.
    # axios 설정 객체(axios({ url }))·인스턴스 호출(api.get·post·put·patch·delete·head·request)도 본다 (리뷰 N6, 1.182.0 실측)
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: axios.$M($URL, ...)
          - pattern: 'axios.create({..., baseURL: $URL, ...})'
          - pattern: 'axios({..., url: $URL, ...})'
          - pattern: new WebSocket($URL, ...)
          - patterns:
              - pattern: $O.$N($URL, ...)
              - metavariable-regex:
                  metavariable: $N
                  regex: ^(get|post|put|patch|delete|head|request)$
              # 같은 이름 메서드를 가진 Map·URLSearchParams·캐시·저장소·라우터 수신자는 제외 (3차 리뷰 S3). {0,100} 은 선형 유지용
              - metavariable-regex:
                  metavariable: $O
                  regex: ^(?!.{0,100}?(?i:map|cache|params|storage|router|i18n|headers)$)
      - metavariable-regex:
          metavariable: $URL
          regex: ^['"`](?:http|ws)://(?!(?:localhost|127\.0\.0\.1|10\.0\.2\.2)(?:[:/?#'"`]|$))
