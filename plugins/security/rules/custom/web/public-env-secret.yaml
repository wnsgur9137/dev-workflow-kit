# W2 — 클라이언트 번들에 포함되는 공개 접두사 환경 변수에 비밀 값 이름 (docs/security/07 스택별 설계/Web.md)
# 이름 규칙(정규식)은 scripts/lib/checks.py 의 PUBLIC_ENV_SECRET_RE 와 같은 문자열이어야 한다 — tests/test_checks.py 가 확인한다.
rules:
  - id: public-env-secret
    message: >-
      공개 접두사(NEXT_PUBLIC_·VITE_·REACT_APP_ 등) 환경 변수는 빌드 시 클라이언트 번들에 그대로 들어갑니다. 이름이 비밀 값을 가리키면 브라우저에 노출됩니다. 서버 전용 변수로 옮기고 이미 배포됐다면 키를 폐기하세요.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      stack: web
    patterns:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: import.meta.env.$KEY
          - pattern: |
              const {..., $KEY, ...} = process.env
          - pattern: |
              const {..., $KEY, ...} = import.meta.env
      - metavariable-regex:
          metavariable: $KEY
          regex: '^(?:NEXT_PUBLIC_|VITE_|REACT_APP_|NUXT_PUBLIC_|GATSBY_|EXPO_PUBLIC_|PUBLIC_)(?!(?:[A-Za-z0-9]+_)*(?:PUBLISHABLE|ANON|PUBLIC|SITE|SITEKEY|MEASUREMENT|FIREBASE|MAPBOX)(?:_|$))(?:[A-Za-z0-9]+_)*(?:SECRET|PRIVATE|PASSWORD|PASSWD|TOKEN|SERVICE_ROLE|CREDENTIAL|CREDENTIALS)(?:_[A-Za-z0-9_]*)?$'
  - id: public-env-secret-bracket
    message: >-
      공개 접두사(NEXT_PUBLIC_·VITE_·REACT_APP_ 등) 환경 변수는 빌드 시 클라이언트 번들에 그대로 들어갑니다. 이름이 비밀 값을 가리키면 브라우저에 노출됩니다. 서버 전용 변수로 옮기고 이미 배포됐다면 키를 폐기하세요.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      stack: web
    patterns:
      - pattern-either:
          - pattern: process.env[$STR]
          - pattern: import.meta.env[$STR]
      - metavariable-regex:
          metavariable: $STR
          regex: '^["''`](?:NEXT_PUBLIC_|VITE_|REACT_APP_|NUXT_PUBLIC_|GATSBY_|EXPO_PUBLIC_|PUBLIC_)(?!(?:[A-Za-z0-9]+_)*(?:PUBLISHABLE|ANON|PUBLIC|SITE|SITEKEY|MEASUREMENT|FIREBASE|MAPBOX)(?:_|$))(?:[A-Za-z0-9]+_)*(?:SECRET|PRIVATE|PASSWORD|PASSWD|TOKEN|SERVICE_ROLE|CREDENTIAL|CREDENTIALS)(?:_[A-Za-z0-9_]*)?["''`]$'
