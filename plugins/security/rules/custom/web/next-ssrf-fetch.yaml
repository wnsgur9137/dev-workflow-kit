# W5 — 요청 값(쿼리·본문·searchParams·헤더)으로 만든 URL 로 서버에서 요청 (SSRF, docs/security/07 스택별 설계/Web.md)
# 오탐을 줄이려고 출처는 요청 객체(req·request) 와 URL 의 searchParams 로 한정하고,
# 고정 호스트로 시작하는 URL 은 제외한다 (PR #24 리뷰). 클라이언트 쪽 router.query 등은 출처에 맞지 않는다.
rules:
  - id: next-ssrf-fetch
    message: >-
      요청에서 받은 값이 서버 측 HTTP 요청의 URL 로 쓰입니다(SSRF). 내부망·메타데이터 주소(169.254.169.254 등)로
      요청을 보내게 만들 수 있습니다. 허용 호스트 목록으로 검증하거나 URL 대신 식별자를 받아 서버에서 주소를 정하세요.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: security
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      confidence: MEDIUM
      stack: web
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: await $REQ.json()
              - pattern: await $REQ.formData()
              - pattern: $REQ.headers.get(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request)$
      - pattern: $X.searchParams.get(...)
      - pattern: $X.searchParams.getAll(...)
      # Next.js 공식 예시: const { searchParams } = new URL(request.url) / const sp = request.nextUrl.searchParams
      - patterns:
          - pattern-either:
              - pattern: $SP.get(...)
              - pattern: $SP.getAll(...)
          - pattern-either:
              - pattern-inside: |
                  const { searchParams: $SP } = $U; ...
              - pattern-inside: |
                  const $SP = $R.nextUrl.searchParams; ...
              - pattern-inside: |
                  const $SP = new URL(...).searchParams; ...
              - pattern-inside: |
                  const $SP = $U.searchParams; ...
      - patterns:
          - pattern-either:
              - pattern: searchParams.get(...)
              - pattern: searchParams.getAll(...)
          - pattern-inside: |
              const { searchParams } = $U; ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$METHOD($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$METHOD($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
          - focus-metavariable: $URL
          # 고정 스킴·호스트로 시작하는 URL(경로만 바뀜)은 SSRF 가 아니다
          - metavariable-regex:
              metavariable: $URL
              regex: ^(?!\s*[`"']https?://[^`"'$/{}\s]+/)
          # 클라이언트 컴포넌트('use client')의 요청은 브라우저에서 나가므로 SSRF 가 아니다
          - pattern-not-inside: |
              'use client'
              ...
          - pattern-not-inside: |
              "use client"
              ...
