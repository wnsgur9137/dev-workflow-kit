# I3 — UserDefaults 에 토큰·비밀번호 저장 (docs/security/07 스택별 설계/iOS.md)
rules:
  - id: insecure-storage
    message: >-
      UserDefaults 는 암호화되지 않은 plist 로 저장되어 백업·탈옥 기기에서 그대로 읽힙니다. 토큰·비밀번호는
      Keychain(kSecAttrAccessibleWhenUnlockedThisDeviceOnly 등)에 저장하세요.
    severity: WARNING
    languages: [swift]
    metadata:
      category: security
      cwe: ["CWE-312: Cleartext Storage of Sensitive Information"]
      owasp: ["M2: Insecure Data Storage"]
      stack: ios
    # Swift 문자열 리터럴 메타변수에는 metavariable-regex 가 맞지 않아(1.182.0 실측) 키 이름은 pattern-regex 로 본다.
    # 받는 쪽은 UserDefaults 로 한정한다 — KeychainSwift·KeychainWrapper 의 같은 set(_:forKey:) 를 잡지 않게 (PR #27 리뷰)
    patterns:
      - pattern-either:
          - pattern: UserDefaults.standard.set(...)
          - pattern: UserDefaults.standard.setValue(...)
          - pattern: UserDefaults($...ARGS)?.set(...)
          - pattern: UserDefaults($...ARGS)?.setValue(...)
          - pattern: UserDefaults($...ARGS)!.set(...)
          - pattern: UserDefaults($...ARGS)!.setValue(...)
          - patterns:
              - pattern-either:
                  - pattern: $D.set(...)
                  - pattern: $D.setValue(...)
              - metavariable-regex:
                  metavariable: $D
                  regex: (?i)^(defaults|userdefaults|standard|shareddefaults|groupdefaults|appdefaults)$
          # self.defaults.set(...) 에서 $D 는 self 에만 묶인다(1.182.0 실측) — 마지막 이름 $F 로 판정 (PR #27 재리뷰)
          - patterns:
              - pattern-either:
                  - pattern: $X.$F.set(...)
                  - pattern: $X.$F.setValue(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i)^(defaults|userdefaults|shareddefaults|groupdefaults|appdefaults)$
      - pattern-regex: (?i)forKey:\s*"[^"\n]{0,100}(token|password|passwd|secret|credential|api_?key|session_?(id|token|key))
