# I6 — 약한 암호화 (MD5·SHA1·DES·ECB) (docs/security/07 스택별 설계/iOS.md)
rules:
  - id: weak-crypto
    message: >-
      MD5·SHA1·DES·ECB 모드는 충돌·복호화 공격에 취약합니다. 해시는 SHA-256 이상(CryptoKit SHA256),
      암호화는 AES-GCM(CryptoKit AES.GCM)을 쓰세요.
    severity: WARNING
    languages: [swift]
    metadata:
      category: security
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["M5: Insufficient Cryptography"]
      stack: ios
    pattern-either:
      - pattern: CC_MD5(...)
      - pattern: CC_SHA1(...)
      - pattern: Insecure.MD5.hash(...)
      - pattern: Insecure.SHA1.hash(...)
      - pattern: kCCAlgorithmDES
      - pattern: kCCAlgorithm3DES
      - pattern: kCCOptionECBMode
      - pattern: kCCAlgorithmRC4
      - pattern: kCCAlgorithmRC2
      - pattern: Insecure.MD5()
      - pattern: Insecure.SHA1()
      - pattern: CC_MD5_Init(...)
      - pattern: CC_SHA1_Init(...)
  - id: weak-crypto-objc
    message: >-
      MD5·SHA1·DES·ECB 모드는 충돌·복호화 공격에 취약합니다. SHA-256 이상, AES-GCM 을 쓰세요.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["*.m", "*.mm"]
    metadata:
      category: security
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      stack: ios
    # 줄 단위. 문자열 리터럴("…//…")과 닫힌 블록 주석(/* … */)은 한 덩어리로 건너뛰고, 닫히지 않은 // 나 /* 뒤와
    # 문자열 안의 키워드는 제외한다 (PR #27 2차 재리뷰 W-A). 닫히지 않은 " ('"'·'\"' 문자 리터럴 포함) 뒤는 미탐.
    # 횟수 지정 반복({0,2000})을 중첩하면 PCRE2 가 "regular expression is too large" 로 규칙을 버리고,
    # 글자 단위 반복에 백트래킹 지점이 쌓이면 수천 자 줄 하나로 PCRE2 한도에 걸려 파일 결과가 오류 없이 사라진다.
    # 그래서 단어·비단어 덩어리를 소유 수량자(++, *+)로 소비하고 키워드 단어 앞에서만 멈춘다 (PR #27 3차 재리뷰 W-1).
    # 한 줄이 약 13만 자를 넘으면 여전히 PCRE2 한도에 걸려 그 파일을 놓칠 수 있다
    pattern-regex: '(?m)^(?:/\*(?:[^*\n]|\*(?!/))*+\*/|"(?:[^"\\\n]|\\.)*+"|[^\n"/\w]++|/(?![/*])|(?!(?:(?:CC_MD5|CC_SHA1)(?:_Init|_Update|_Final)?|kCCAlgorithm(?:DES|3DES|RC4|RC2)|kCCOptionECBMode)\b)\w++)*+\b((?:(?:CC_MD5|CC_SHA1)(?:_Init|_Update|_Final)?|kCCAlgorithm(?:DES|3DES|RC4|RC2)|kCCOptionECBMode))\b'
