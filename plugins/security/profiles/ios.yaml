# iOS (Swift / Objective-C) — docs/security/07 스택별 설계/iOS.md
name: ios
description: Swift / Objective-C iOS 앱
detect: ["**/*.xcodeproj", "**/*.xcworkspace", "**/Package.swift", "**/Podfile"]
# Flutter 의 macos/ 데스크톱 러너는 iOS 앱이 아니다 — 감지에서만 빼고, 루트 iOS 프로젝트의 macos/ 소스는 점검한다
detect_exclude: ["**/macos/**"]
exclude_paths: ["**/Pods/**", "**/DerivedData/**", "**/.build/**", "**/Carthage/Build/**"]
semgrep:
  rulesets: [swift]
  custom: [ios]
sca:
  lockfiles: ["**/Package.resolved"]
  # osv-scanner v2.7.0 은 Podfile.lock 을 추출하지 않는다 — 있으면 "점검되지 않음" 경고
  unsupported_lockfiles: ["**/Podfile.lock"]
  missing_lockfile_hint: "Swift Package Manager 를 쓰면 Package.resolved 를 커밋하세요"
artifact:
  types: [ipa]
  analyzer: mobsf
checks: [ios-ats, ios-xcconfig-secret]
checklist: ios
